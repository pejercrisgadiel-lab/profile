<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Static Navbar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="m-4">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light rounded-3 shadow-sm">
        <div class="container-fluid">
            
            <!-- BRAND LOGO + TEXT -->
            <a href="#" class="navbar-brand d-flex align-items-center">
                <img src="assets/cpeimg.jpg" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                <span class="fw-bold">Computer Engineering Website</span>
            </a>

            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a href="#" class="nav-item nav-link active">Home</a>
                    <a href="#" class="nav-item nav-link">What is CpE?</a>
                    <a href="#" class="nav-item nav-link">CPE at UE</a>
                    <a href="#" class="nav-item nav-link disabled" tabindex="-1">Specializations</a>
                    <a href="#" class="nav-item nav-link disabled" tabindex="-1">Opportunities</a>
                    <a href="#" class="nav-item nav-link disabled" tabindex="-1">Faculty</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CAROUSEL -->
    <div id="myCarousel" class="carousel slide mt-4 rounded-3 overflow-hidden shadow" data-bs-ride="carousel">
        
        <!-- Carousel Indicators (Updated to BS5 Button Syntax & 4 Slides) -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
        </div>
        
        <!-- Wrapper for Carousel Items -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/slide1.jpg" class="d-block w-100 object-fit-cover" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="assets/slide2.jpg" class="d-block w-100 object-fit-cover" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="assets/slide3.jpg" class="d-block w-100 object-fit-cover" alt="Slide 3">
            </div>
            <div class="carousel-item">
                <img src="assets/slide3.jpg" class="d-block w-100 object-fit-cover" alt="Slide 4">
            </div>
        </div>

        <!-- Carousel Controls (Updated to BS5 Button Syntax) -->
        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</div>
</body>
</html>
